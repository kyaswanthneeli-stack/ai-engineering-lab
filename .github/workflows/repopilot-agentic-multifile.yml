name: RepoPilot tool-using model multi-file trial

on:
  push:
    paths:
      - '.github/workflows/repopilot-agentic-multifile.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  agentic-multifile:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: repopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install harness
        run: python -m pip install -e .
      - name: Pull test image and start local coding model
        run: |
          docker pull python:3.12-alpine
          docker run -d --name repopilot-agent-model -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          for attempt in 1 2 3; do
            if docker exec repopilot-agent-model ollama pull qwen2.5-coder:7b; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Agent inspect, propose, and verify multi-file fix
        env:
          REPOPILOT_BASE_URL: http://127.0.0.1:11434/v1
          REPOPILOT_MODEL: qwen2.5-coder:7b
          REPOPILOT_MAX_TOKENS: '2000'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from repopilot.agentic_benchmark import propose_agentic_benchmark
          from repopilot.github_issue import fetch_public_issue
          from repopilot.engine import execute
          from repopilot.spec import IssueSpec
          from repopilot.pr import patch_targets
          from repopilot.review import review_proposal
          repo=Path('fixtures/invoice-multifile')
          run=Path('.runs/agentic-invoice-issue3-v13-7b')
          run.mkdir(parents=True,exist_ok=False)
          report={'model':'qwen2.5-coder:7b','model_generated':False,
                  'verified':False,'issue':'https://github.com/kyaswanthneeli-stack/ai-engineering-lab/issues/3',
                  'test_source':'curated reference regression tests, not model generated'}
          try:
              issue=fetch_public_issue(report['issue'])
              proposal,meta=propose_agentic_benchmark(
                  repo, issue['text']+"\n\nCritical acceptance criteria: pricing.py's taxable_subtotal() MUST itself raise ValueError when given negative prices, even when called directly without invoice_total(). Implement the check inside taxable_subtotal(), not only checkout.py. Also round taxable subtotal and final invoice total to two decimal places.", os.environ['REPOPILOT_MODEL'],
                  os.environ['REPOPILOT_BASE_URL'],max_steps=18,
                  required_targets={'pricing.py','checkout.py'})
              report['model_generated']=True
              report['agent_steps']=meta['agent_steps']
              report['tool_trace']=meta['tool_trace']
              report['model_patch_targets']=patch_targets(proposal.patch)
              (run/'model-patch.diff').write_text(proposal.patch)
              reference=json.loads(Path('examples/invoice-multifile-issue.json').read_text())
              spec=IssueSpec.from_dict({**reference,'patch':proposal.patch,'issue_id':issue['issue_id']})
              review=review_proposal(spec)
              report['static_review']=review['status']
              if review['status']=='blocked':
                  raise ValueError('Static review blocked proposed patch')
              verification=execute(repo,spec,run/'docker-verification.json')
              report['verified']=verification['outcome']=='verified_in_sandbox'
              report['docker_baseline']=verification['baseline']['exit_code']
              report['docker_reproduction']=verification['before']['exit_code']
              report['docker_after']=verification['after']['exit_code']
              if not {'pricing.py','checkout.py'} <= set(report['model_patch_targets']):
                  raise ValueError('Model did not produce required two-file patch')
              if not report['verified']:
                  raise ValueError('Docker regression did not verify proposed model patch')
              report['outcome']='verified'
          except Exception as exc:
              report['outcome']='failed'
              report['error_type']=type(exc).__name__
              report['error']=str(exc)[:320]
          (run/'result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if report['outcome']!='verified':
              raise SystemExit('Agentic multi-file trial did not meet acceptance criteria')
          PY
      - name: Publish verified code to human-review branch (never create PR automatically)
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          run=Path('.runs/agentic-invoice-issue3-v13-7b')
          result=json.loads((run/'result.json').read_text())
          assert result['outcome']=='verified'
          assert result['model_generated'] is True
          assert result['verified'] is True
          assert set(result['model_patch_targets'])=={'pricing.py','checkout.py'}
          assert (run/'model-patch.diff').is_file()
          print('Verified AI patch contains EXACTLY pricing.py and checkout.py')
          PY
          PATCH_FILE="$PWD/.runs/agentic-invoice-issue3-v13-7b/model-patch.diff"
          # Retain the EXACT test suite that Docker just verified, before
          # switching to the main branch (where the challenge spec may differ).
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('examples/invoice-multifile-issue.json').read_text())
          assert 'test_direct_taxable_subtotal_negative_rejected' in spec['reproduction_test']
          Path('.runs/agentic-invoice-issue3-v13-7b/reproduction_test.py').write_text(
              spec['reproduction_test'],encoding='utf-8')
          PY
          BRANCH="repopilot/issue-3-ai-verified-$GITHUB_RUN_ID"
          export BRANCH
          git -C .. fetch --no-tags origin main
          git -C .. switch -c "$BRANCH" FETCH_HEAD
          git -C .. apply --check --directory=repopilot/fixtures/invoice-multifile "$PATCH_FILE"
          git -C .. apply --directory=repopilot/fixtures/invoice-multifile "$PATCH_FILE"
          cp "$PWD/.runs/agentic-invoice-issue3-v13-7b/reproduction_test.py" \
            fixtures/invoice-multifile/tests/test_reproduction.py
          git -C .. config user.name 'github-actions[bot]'
          git -C .. config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .. add repopilot/fixtures/invoice-multifile/pricing.py repopilot/fixtures/invoice-multifile/checkout.py repopilot/fixtures/invoice-multifile/tests/test_reproduction.py
          git -C .. diff --cached --check
          git -C .. commit -m 'fix(repopilot): verified Qwen 7B multi-file invoice repair (#3)'
          git -C .. push origin "HEAD:refs/heads/$BRANCH"
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('.runs/agentic-invoice-issue3-v13-7b/result.json')
          report=json.loads(path.read_text())
          report['candidate_branch']=os.environ['BRANCH']
          report['requires_human_review_before_pr']=True
          path.write_text(json.dumps(report,indent=2)+'\n')
          print('Candidate branch published:',report['candidate_branch'])
          print('Draft PR not created: requires explicit human review.')
          PY
      - name: Upload attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repopilot-agentic-multifile-attempt-v13-7b
          path: repopilot/.runs/agentic-invoice-issue3-v13-7b/
          if-no-files-found: warn
          retention-days: 30
      - name: Stop model
        if: always()
        run: docker rm -f repopilot-agent-model || true
