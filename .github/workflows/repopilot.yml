name: RepoPilot checks
on:
  push:
    paths:
      - 'repopilot/**'
      - '.github/workflows/repopilot.yml'
  pull_request:
    paths:
      - 'repopilot/**'
      - '.github/workflows/repopilot.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: repopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RepoPilot
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Index sample
        run: python -m repopilot.cli index examples/calculator
