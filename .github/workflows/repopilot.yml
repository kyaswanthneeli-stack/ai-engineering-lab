name: RepoPilot checks
on:
  push:
    paths:
      - 'repopilot/**'
      - '.github/workflows/repopilot.yml'
  pull_request:
    paths:
      - 'repopilot/**'
      - '.github/workflows/repopilot.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: repopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RepoPilot
        run: python -m pip install -e .
      - name: Install coverage instrumentation
        run: python -m pip install 'coverage>=7,<9'
      - name: Compile all source and tests
        run: python -m compileall -q src/repopilot tests
      - name: Run unit tests with measured coverage
        run: |
          mkdir -p .runs
          python -m coverage run --source=repopilot -m unittest discover -s tests -v
          python -m coverage report --show-missing
          python -m coverage xml -o .runs/coverage.xml
      - name: SWE-bench export preflight (0 official predictions)
        run: |
          mkdir -p .runs/empty-submissions
          python -m repopilot.swebench_export benchmarks/swebench-lite-12.json .runs/empty-submissions --output .runs/swebench-predictions.jsonl > .runs/swebench-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.runs/swebench-preflight.json').read_text())
          assert x['selected_tasks']==12
          assert x['submitted_predictions']==0
          assert x['official_resolution_rate'] is None
          print('PASS: 12 pinned tasks, 0 falsely claimed predictions or scores')
          PY
      - name: Pinned public GitHub checkout smoke test
        env:
          REPOPILOT_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path
          from repopilot.checkout import pinned_checkout
          from repopilot.graph import import_graph
          with tempfile.TemporaryDirectory(prefix="pinned-github-") as d:
              repo=pinned_checkout(
                "https://github.com/kyaswanthneeli-stack/ai-engineering-lab/issues/1",
                os.environ["REPOPILOT_COMMIT"],Path(d)/"repo")
              assert (repo/"repopilot"/"src"/"repopilot"/"cli.py").is_file()
              g=import_graph(repo/"repopilot"/"src"/"repopilot")
              assert "planner" in g["modules"]
              print("PASS: pinned public repository checkout and static graph")
          PY
      - name: Index sample
        run: python -m repopilot.cli index examples/calculator
      - name: Test current sample application
        run: cd examples/calculator && python -m unittest discover -s tests -v
      - name: Prepare pinned Docker test image
        run: docker pull python:3.12-alpine
      - name: Verify sample issue in restricted Docker container
        run: python -m repopilot.cli verify fixtures/calculator-buggy examples/issue.json --output .runs/sample-verification.json
      - name: Verify multi-file invoice issue in restricted Docker
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from pathlib import Path
          from repopilot.engine import execute
          from repopilot.pr import patch_targets
          from repopilot.sandbox import run_tests
          from repopilot.spec import IssueSpec
          root=Path("fixtures/invoice-multifile")
          out=Path(".runs/invoice-multifile-verification.json")
          spec=IssueSpec.from_json(Path("examples/invoice-multifile-issue.json"))
          assert len(patch_targets(spec.patch))==2
          if (root/"tests/test_reproduction.py").is_file():
              # A PR may already contain the verified model-generated repair.
              # Never reapply the original reference patch or falsely claim
              # a new fail-before test in that already-patched checkout.
              result=run_tests(root,("python","-m","unittest","discover","-s","tests","-v"))
              assert not result.timed_out and result.exit_code==0
              out.write_text(json.dumps({
                  "outcome":"patched_candidate_passed_in_sandbox",
                  "already_patched":True,
                  "after":asdict(result)
              },indent=2)+"\\n")
              print("PASS: patched candidate full suite passes in restricted Docker")
          else:
              report=execute(root,spec,out)
              assert report["baseline"]["exit_code"]==0
              assert report["before"]["exit_code"]!=0
              assert report["after"]["exit_code"]==0
              assert report["outcome"]=="verified_in_sandbox"
              print("PASS: unpatched fixture baseline green -> reproduction red -> patched green")
          PY
      - name: Inspect reproduction evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('.runs/sample-verification.json').read_text())
          assert result['outcome']=='verified_in_sandbox'
          assert result['before']['exit_code'] != 0 and result['after']['exit_code'] == 0
          print('PASS: reproduction failed before patch and passed afterward')
          PY
      - name: Generate offline dashboard and fixture-only benchmark
        run: |
          python -m repopilot.cli dashboard .runs/sample-verification.json --output .runs/dashboard.html
          python -m repopilot.cli benchmark .runs/sample-verification.json --dataset "reference-patch fixture, NOT model solved" > .runs/benchmark-fixture.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('.runs/benchmark-fixture.json').read_text())
          assert data['attempts']==1
          assert data['model_generated_attempts']==0
          assert data['model_success_rate'] is None
          print('Correctly excluded fixture from AI resolution claims')
          PY
      - name: Upload reviewer evidence (fixture only)
        uses: actions/upload-artifact@v4
        with:
          name: repopilot-verification-fixture
          path: |
            repopilot/.runs/dashboard.html
            repopilot/.runs/benchmark-fixture.json
            repopilot/.runs/sample-verification.json
            repopilot/.runs/invoice-multifile-verification.json
            repopilot/.runs/coverage.xml
          if-no-files-found: error
          retention-days: 30
