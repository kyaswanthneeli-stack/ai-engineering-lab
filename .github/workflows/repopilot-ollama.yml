name: RepoPilot local Ollama integration

on:
  push:
    paths:
      - '.github/workflows/repopilot-ollama.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  real-model-attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: repopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install harness
        run: python -m pip install -e .
      - name: Start Ollama on runner
        run: |
          docker run --detach --name repopilot-ollama -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Pull small public coding model
        run: docker exec repopilot-ollama ollama pull qwen2.5-coder:3b
      - name: Pull restricted test image
        run: docker pull python:3.12-alpine
      # The harness may normalize a malformed hunk only when original deleted lines match uniquely.
      - name: Attempt actual model-generated fix
        id: attempt
        continue-on-error: true
        env:
          REPOPILOT_BASE_URL: http://127.0.0.1:11434/v1
          REPOPILOT_MODEL: qwen2.5-coder:3b
          REPOPILOT_DEBUG_CANDIDATE: '1' # Public synthetic fixture only; do not use for private repos
        run: |
          python -m repopilot.cli run fixtures/calculator-buggy https://github.com/kyaswanthneeli-stack/ai-engineering-lab/issues/1 --output .runs/ollama-issue-1
      - name: Print verifiable attempt status
        if: always()
        run: |
          if test -f .runs/ollama-issue-1/run.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.runs/ollama-issue-1/run.json').read_text())
          print('MODEL ATTEMPT OUTCOME:',d['outcome'])
          print('MODEL GENERATED PROPOSAL:',d.get('model_generated_proposal'))
          print('DOCKER VERIFICATION:',d.get('outcome')=='verified_in_sandbox')
          print('PR CREATED:',False)
          print('ERROR TYPE:',d.get('error_type','none'))
          print('ERROR:',d.get('error','none'))
          PY
          else
            echo 'SETUP FAILED: No model attempt report produced. This is NOT a resolved issue.'
          fi
      - name: Assert genuine model proposal and Docker verification
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.runs/ollama-issue-1')
          if not (root/'run.json').is_file():
              raise SystemExit('NO LIVE RUN: Missing run.json')
          d=json.loads((root/'run.json').read_text())
          if d.get('outcome')!='verified_in_sandbox':
              raise SystemExit('LIVE RUN FAILED: '+str(d.get('error_type','unknown')))
          if not d.get('model_generated_proposal'):
              raise SystemExit('LIVE RUN FAILED: No genuine model proposal')
          if d.get('static_review',{}).get('status')=='blocked':
              raise SystemExit('LIVE RUN FAILED: Static review blocked proposal')
          if d.get('baseline',{}).get('exit_code')!=0 or d.get('before',{}).get('exit_code') in (None,0) or d.get('after',{}).get('exit_code')!=0:
              raise SystemExit('LIVE RUN FAILED: Required Docker evidence missing')
          print('PASS: model-generated patch passed review and real Docker baseline/reproduction/regression')
          PY
      - name: Upload issue attempt and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repopilot-ollama-issue-1-attempt
          path: repopilot/.runs/ollama-issue-1/
          if-no-files-found: warn
          retention-days: 30
      - name: Shutdown local model
        if: always()
        run: docker rm -f repopilot-ollama || true
