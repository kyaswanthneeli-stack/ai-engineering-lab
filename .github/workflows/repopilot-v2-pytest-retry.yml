name: RepoPilot v2 verify Pytest patch recovery with official evaluator

on:
  push:
    paths:
      - '.github/workflows/repopilot-v2-pytest-retry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: repopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install v2 model runner and official dataset loader
        run: |
          python -m pip install -e .
          python -m pip install 'datasets>=3,<5'
      - name: Validate current branch regression suite before real-model run
        run: |
          python -m unittest discover -s tests -q
          python -m compileall -q src/repopilot
      - name: Verify Pytest task belongs to immutable original 12-task manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('benchmarks/swebench-lite-12.json').read_text())
          allowed={x['instance_id'] for x in manifest['tasks']}
          selected={'pytest-dev__pytest-11148'}
          assert len(manifest['tasks'])==12 and selected<=allowed
          print('Validated pilot task selection against original pinned cohort')
          PY
      - name: Launch local model on isolated GitHub Actions runner
        run: |
          docker run -d --name repopilot-v2-benchmark-model -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          for attempt in 1 2 3; do
            if docker exec repopilot-v2-benchmark-model ollama pull qwen2.5-coder:3b; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Prewarm local Qwen model before pinned checkout
        run: |
          python - <<'PY'
          import json,urllib.request
          payload=json.dumps({
              "model":"qwen2.5-coder:3b","stream":False,
              "prompt":"Reply with OK only.",
              "options":{"num_predict":8,"temperature":0}
          }).encode("utf-8")
          request=urllib.request.Request(
              "http://127.0.0.1:11434/api/generate",data=payload,
              method="POST",headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(request,timeout=180) as response:
              result=json.load(response)
          assert isinstance(result.get("response"),str)
          print("Local Ollama inference prewarm passed; no task source transmitted")
          PY
      - name: Reattempt exact failed Pytest issue with bounded provider retries
        env:
          REPOPILOT_BASE_URL: http://127.0.0.1:11434/v1
          REPOPILOT_MODEL: qwen2.5-coder:3b
          REPOPILOT_OLLAMA_NATIVE: '1'
          REPOPILOT_MAX_TOKENS: '1200'
          REPOPILOT_NATIVE_RETRIES: '2'
          REPOPILOT_NATIVE_TIMEOUT: '180'
        run: |
          python -m repopilot.benchmark_batch \
            --manifest benchmarks/swebench-lite-12.json \
            --instance-ids pytest-dev__pytest-11148 \
            --output .runs/v2-pytest-retry-attempts \
            --per-task-timeout 900 \
            --max-steps 10
      - name: Classify generated prediction or failure without calling it resolved
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".runs/v2-pytest-retry-attempts/attempts/pytest-dev__pytest-11148/attempt.json")
          if p.is_file():
              r=json.loads(p.read_text())
              print("Task:",r.get("instance_id"))
              print("Status:",r.get("status"))
              print("Error class:",r.get("error_type"))
              print("Failure category:",r.get("failure_category"))
              print("Agent steps:",r.get("agent_steps"))
              print("Patch submitted:",(p.parent/"unreviewed-prediction.json").is_file())
          else:
              print("No task attempt file, see batch summary or timeout reason")
          PY
      - name: Check prediction provenance and separate unsubmitted attempts
        id: prediction_gate
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('.runs/v2-pytest-retry-attempts')
          summaries=json.loads((root/'summary.json').read_text())
          predictions=[json.loads(x) for x in (root/'predictions.jsonl').read_text().splitlines() if x.strip()]
          allowed={'pytest-dev__pytest-11148'}
          ids=[x['instance_id'] for x in predictions]
          assert summaries['selected_tasks']==1 and summaries['pinned_manifest_tasks']==12
          assert len(set(ids))==len(ids) and set(ids)<=allowed
          assert len(predictions)==summaries['model_predictions']
          assert all(x['model_patch'].startswith('diff --git a/') and
                     x['model_patch'].endswith('\n') for x in predictions)
          assert summaries['officially_evaluated'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('has_predictions='+str(bool(predictions)).lower()+'\n')
          print('Model-generated valid predictions:',len(predictions),
                '; no missing prediction is counted as a solved issue')
          PY
      - name: Install official evaluator only when predictions exist
        if: steps.prediction_gate.outputs.has_predictions == 'true'
        run: python -m pip install 'swebench>=3.0,<5.0'
      - name: Officially score only submitted original patches
        if: steps.prediction_gate.outputs.has_predictions == 'true'
        run: |
          mapfile -t IDS < <(python - <<'PY'
          import json
          from pathlib import Path
          for line in Path('.runs/v2-pytest-retry-attempts/predictions.jsonl').read_text().splitlines():
              if line.strip():
                  print(json.loads(line)['instance_id'])
          PY
          )
          if [ "${#IDS[@]}" -lt 1 ]; then exit 1; fi
          python -m swebench.harness.run_evaluation \
            --dataset_name princeton-nlp/SWE-bench_Lite \
            --split test \
            --predictions_path .runs/v2-pytest-retry-attempts/predictions.jsonl \
            --instance_ids "${IDS[@]}" \
            --max_workers 1 \
            --run_id "repopilot-v2-pytest-retry-${GITHUB_RUN_ID}"
      - name: Preserve prediction summary and portable evaluator artifacts
        if: always()
        run: |
          mkdir -p .runs/v2-pytest-retry-evidence
          python - <<'PY'
          import json,shutil,tarfile
          from pathlib import Path
          out=Path('.runs/v2-pytest-retry-evidence')
          attempted=Path('.runs/v2-pytest-retry-attempts')
          for name in ['summary.json','predictions.jsonl','progress.json']:
              p=attempted/name
              if p.is_file():
                  shutil.copy2(p,out/name)
          candidates=list(Path('.').glob('*repopilot-v2-pytest-retry-*.json'))
          if Path('logs/evaluation').is_dir():
              candidates+=list(Path('logs/evaluation').rglob('results.json'))
              with tarfile.open(out/'official-logs.tar.gz','w:gz') as archive:
                  archive.add('logs/evaluation',arcname='logs/evaluation')
          for candidate in candidates:
              try:
                  result=json.loads(candidate.read_text())
              except (ValueError,OSError):
                  continue
              if isinstance(result,dict) and 'resolved_ids' in result:
                  (out/'official-results.json').write_text(json.dumps(result,indent=2)+'\n')
                  print('Copied official score from',candidate)
                  break
          (out/'provenance.json').write_text(json.dumps({
              'branch':'repopilot/v2-large-repository-context',
              'selected_instances':['pytest-dev__pytest-11148'],
              'model':'qwen2.5-coder:3b','reference_patches_supplied':False,
              'evaluated':(out/'official-results.json').is_file()
          },indent=2)+'\n')
          PY
      - name: Upload authentic trial evidence, regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repopilot-v2-pytest-retry-evidence
          path: |
            repopilot/.runs/v2-pytest-retry-evidence/
            repopilot/.runs/v2-pytest-retry-attempts/attempts/
          if-no-files-found: warn
          retention-days: 30
      - name: Stop local model
        if: always()
        run: docker rm -f repopilot-v2-benchmark-model || true
      - name: Mark Pytest recovery successful only if independent harness resolved it
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".runs/v2-pytest-retry-evidence")
          summary_path=root/"summary.json"
          if not summary_path.is_file():
              raise SystemExit("No model-attempt evidence. Official recovery unverified.")
          attempt=json.loads(summary_path.read_text())
          if attempt.get("model_predictions")!=1:
              raise SystemExit("Pytest unresolved: the model produced no valid patch (see uploaded evidence).")
          results_path=root/"official-results.json"
          if not results_path.is_file():
              raise SystemExit("Pytest unverified: official evaluator result missing.")
          result=json.loads(results_path.read_text())
          if "pytest-dev__pytest-11148" not in result.get("resolved_ids",[]):
              raise SystemExit("Pytest unresolved in independent SWE-bench evaluator.")
          print("Pytest officially resolved; model patch and evaluator artifacts preserved.")
          PY
