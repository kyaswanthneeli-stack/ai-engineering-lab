name: RepoPilot four-case v9 smoke diagnosis
on:
  pull_request:
    paths:
      - '.github/workflows/repopilot-v9-smoke-diagnostics.yml'
      - 'repopilot/ci/replay_v9_smoke.py'
      - 'repopilot/src/repopilot/candidate_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: repopilot-v9-smoke-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: repopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install trusted diagnostic code and dataset reader
        run: python -m pip install -e . 'datasets>=3.0,<5.0'
      - name: Download exact official v9 evidence
        uses: actions/download-artifact@v4
        with:
          name: repopilot-12-official-harness-v9
          run-id: 44776554310
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: repopilot/.runs/v9-replay-original
      - name: Build unchanged trusted offline dependency runtime
        run: docker build --pull -t repopilot-candidate-deps:py310 -f ci/Dockerfile.candidate-smoke ci
      - name: Replay three failed baselines and one passing control without inference
        env:
          REPOPILOT_CANDIDATE_SMOKE_IMAGE: repopilot-candidate-deps:py310
        run: |
          python ci/replay_v9_smoke.py \
            --evidence .runs/v9-replay-original \
            --output .runs/v9-smoke-diagnostics \
            --label before-runtime-fix
      - name: Preserve sanitized replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repopilot-v9-four-case-smoke-diagnostics
          path: repopilot/.runs/v9-smoke-diagnostics/
          if-no-files-found: warn
          retention-days: 30
