name: RepoPilot v2.2.0 stable package preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repopilot-v2-2-stable-preflight.yml'
      - '.github/workflows/repopilot-v2-2-stable-release.yml'
      - 'repopilot/**'

permissions:
  contents: read

jobs:
  package-preflight:
    # Never run with untrusted fork code; no registry/release permissions.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: repopilot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project and preflight dependencies
        run: |
          python -m pip install -e .
          python -m pip install 'coverage>=7,<9' 'build>=1,<3'
      - name: Verify stable package version and release-note presence
        run: |
          python - <<'PY'
          import tomllib
          import repopilot
          from importlib.metadata import version
          from pathlib import Path
          project=tomllib.loads(Path("pyproject.toml").read_text())
          assert project["project"]["version"] == "2.2.0"
          assert version("repopilot") == repopilot.__version__ == "2.2.0"
          assert Path("RELEASE_NOTES_v2.2.0.md").is_file()
          assert Path("docs/STABLE_RELEASE_HANDOFF_v2.2.0.md").is_file()
          PY
      - name: Compile and run Python tests with coverage
        run: |
          python -m compileall -q src/repopilot tests
          python -m coverage run --source=repopilot -m unittest discover -s tests -v
          python -m coverage report --show-missing
      - name: Verify restricted Docker baseline-red-patched-green
        run: |
          docker pull python:3.12-alpine
          python -m repopilot.cli verify fixtures/calculator-buggy examples/issue.json --output .runs/verify-stable.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path(".runs/verify-stable.json").read_text())
          assert result["outcome"] == "verified_in_sandbox"
          assert result["baseline"]["exit_code"] == 0
          assert result["before"]["exit_code"] != 0
          assert result["after"]["exit_code"] == 0
          assert result["draft_pr_created"] is False
          PY
      - name: Build and smoke-test versioned wheel and source distribution
        run: |
          python -m build --sdist --wheel --outdir dist .
          test "$(find dist -maxdepth 1 -name 'repopilot-2.2.0-*.whl' | wc -l)" -eq 1
          test -f dist/repopilot-2.2.0.tar.gz
          python -m venv .runs/stable-clean-install
          .runs/stable-clean-install/bin/python -m pip install --no-index --no-deps dist/repopilot-2.2.0-*.whl
          .runs/stable-clean-install/bin/python -m repopilot.cli --help
          .runs/stable-clean-install/bin/python -m repopilot.cli doctor
          sha256sum dist/* | tee .runs/stable-dist-sha256.txt
      - name: Build and verify unprivileged offline CLI image
        run: |
          docker build --pull -f container/Dockerfile.cli -t repopilot-cli:stable-preflight .
          docker image inspect repopilot-cli:stable-preflight --format '{{json .Config.User}}' | grep -F '"65532:65532"'
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 \
            --memory 512m --cpus 1 --user 65532:65532 \
            -v "$PWD/examples/calculator:/workspace/example:ro" \
            repopilot-cli:stable-preflight index /workspace/example > .runs/stable-oci-index.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path(".runs/stable-oci-index.json").read_text())
          assert isinstance(result, list) and result
          PY
      - name: Upload preflight evidence (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: repopilot-v2.2.0-stable-preflight-evidence
          path: |
            repopilot/dist/
            repopilot/.runs/stable-dist-sha256.txt
            repopilot/.runs/stable-oci-index.json
            repopilot/.runs/verify-stable.json
          if-no-files-found: error
          retention-days: 30
