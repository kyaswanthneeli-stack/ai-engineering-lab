name: RepoPilot v2 checkpointed SymPy timeout probe

on:
  push:
    paths:
      - '.github/workflows/repopilot-v2-model-step-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: repopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install v2 model runner and official dataset loader
        run: |
          python -m pip install -e .
          python -m pip install 'datasets>=3,<5'
      - name: Check selected previously timed-out issue belongs to pinned manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('benchmarks/swebench-lite-12.json').read_text())
          allowed={x['instance_id'] for x in manifest['tasks']}
          selected={'sympy__sympy-13773'}
          assert len(manifest['tasks'])==12 and selected<=allowed
          print('Validated pilot task selection against original pinned cohort')
          PY
      - name: Launch local model on isolated GitHub Actions runner
        run: |
          docker run -d --name repopilot-v2-benchmark-model -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          for attempt in 1 2 3; do
            if docker exec repopilot-v2-benchmark-model ollama pull qwen2.5-coder:1.5b; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Probe a previously timed-out pinned SymPy issue with actual local model
        env:
          REPOPILOT_BASE_URL: http://127.0.0.1:11434/v1
          REPOPILOT_MODEL: qwen2.5-coder:1.5b
          REPOPILOT_OLLAMA_NATIVE: '1'
          REPOPILOT_MAX_TOKENS: '768'
          REPOPILOT_ISSUE_CONTEXT_CHARS: '3000'
          REPOPILOT_OLLAMA_STREAM: '1'
          REPOPILOT_NATIVE_RETRIES: '1'
          REPOPILOT_NATIVE_TIMEOUT: '120'
          REPOPILOT_NATIVE_WALL_TIMEOUT: '240'
        run: |
          python -m repopilot.benchmark_batch \
            --manifest benchmarks/swebench-lite-12.json \
            --instance-ids sympy__sympy-13773 \
            --output .runs/v2-step-probe-attempts \
            --per-task-timeout 360 \
            --max-steps 7
      - name: Report last verified stage and model step, without source contents
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path(".runs/v2-step-probe-attempts")
          summary=base/"summary.json"
          if summary.is_file():
              result=json.loads(summary.read_text())
              print("SELECTED:",result.get("selected_tasks"))
              print("VALID MODEL PATCHES:",result.get("model_predictions"))
              print("TIMEOUT STAGES:",result.get("timeout_last_completed_stage_counts"))
              print("OFFICIALLY EVALUATED:",result.get("officially_evaluated"))
              for row in result.get("tasks",[]):
                  print("TASK:",json.dumps({k:row.get(k) for k in (
                      "instance_id","status","error_type","last_completed_stage",
                      "model_step","elapsed_ms")},sort_keys=True))
          for path in sorted(base.glob("attempts/*/stage.json")):
              record=json.loads(path.read_text())
              print("STAGE:",json.dumps(record,sort_keys=True))
          PY
      - name: Check prediction provenance and separate unsubmitted attempts
        id: prediction_gate
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('.runs/v2-step-probe-attempts')
          summaries=json.loads((root/'summary.json').read_text())
          predictions=[json.loads(x) for x in (root/'predictions.jsonl').read_text().splitlines() if x.strip()]
          allowed={'sympy__sympy-13773'}
          ids=[x['instance_id'] for x in predictions]
          assert summaries['selected_tasks']==1 and summaries['pinned_manifest_tasks']==12
          assert len(set(ids))==len(ids) and set(ids)<=allowed
          assert len(predictions)==summaries['model_predictions']
          assert all(x['model_patch'].startswith('diff --git a/') and
                     x['model_patch'].endswith('\n') for x in predictions)
          assert summaries['officially_evaluated'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('has_predictions='+str(bool(predictions)).lower()+'\n')
          print('Model-generated valid predictions:',len(predictions),
                '; no missing prediction is counted as a solved issue')
          PY
      - name: Install official evaluator only when predictions exist
        if: steps.prediction_gate.outputs.has_predictions == 'true'
        run: python -m pip install 'swebench>=3.0,<5.0'
      - name: Officially score only submitted original patches
        if: steps.prediction_gate.outputs.has_predictions == 'true'
        run: |
          mapfile -t IDS < <(python - <<'PY'
          import json
          from pathlib import Path
          for line in Path('.runs/v2-step-probe-attempts/predictions.jsonl').read_text().splitlines():
              if line.strip():
                  print(json.loads(line)['instance_id'])
          PY
          )
          if [ "${#IDS[@]}" -lt 1 ]; then exit 1; fi
          python -m swebench.harness.run_evaluation \
            --dataset_name princeton-nlp/SWE-bench_Lite \
            --split test \
            --predictions_path .runs/v2-step-probe-attempts/predictions.jsonl \
            --instance_ids "${IDS[@]}" \
            --max_workers 1 \
            --run_id "repopilot-v2-step-probe-${GITHUB_RUN_ID}"
      - name: Preserve prediction summary and portable evaluator artifacts
        if: always()
        run: |
          mkdir -p .runs/v2-step-probe-evidence
          python - <<'PY'
          import json,shutil,tarfile
          from pathlib import Path
          out=Path('.runs/v2-step-probe-evidence')
          attempted=Path('.runs/v2-step-probe-attempts')
          for name in ['summary.json','predictions.jsonl','progress.json']:
              p=attempted/name
              if p.is_file():
                  shutil.copy2(p,out/name)
          candidates=list(Path('.').glob('*repopilot-v2-step-probe-*.json'))
          if Path('logs/evaluation').is_dir():
              candidates+=list(Path('logs/evaluation').rglob('results.json'))
              with tarfile.open(out/'official-logs.tar.gz','w:gz') as archive:
                  archive.add('logs/evaluation',arcname='logs/evaluation')
          for candidate in candidates:
              try:
                  result=json.loads(candidate.read_text())
              except (ValueError,OSError):
                  continue
              if isinstance(result,dict) and 'resolved_ids' in result:
                  (out/'official-results.json').write_text(json.dumps(result,indent=2)+'\n')
                  print('Copied official score from',candidate)
                  break
          (out/'provenance.json').write_text(json.dumps({
              'branch':'repopilot/v2-large-repository-context',
              'selected_instances':['sympy__sympy-13773'],
              'model':'qwen2.5-coder:1.5b','reference_patches_supplied':False,
              'evaluated':(out/'official-results.json').is_file()
          },indent=2)+'\n')
          PY
      - name: Upload authentic trial evidence, regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repopilot-v2-official-pilot-evidence
          path: |
            repopilot/.runs/v2-step-probe-evidence/
            repopilot/.runs/v2-step-probe-attempts/attempts/
          if-no-files-found: warn
          retention-days: 30
      - name: Stop local model
        if: always()
        run: docker rm -f repopilot-v2-benchmark-model || true
